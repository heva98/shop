# nginx site config for https://shop.example.com
#
# Assumes:
#   - the repo is checked out at /opt/shop (adjust APP_ROOT below if not)
#   - gunicorn (see ../systemd/shop-gunicorn.service) is listening on
#     127.0.0.1:8000
#   - `python manage.py collectstatic` has been run, so backend/staticfiles
#     exists
#   - the frontend has been built (`npm run build`), so frontend/dist exists
#
# Install: copy/symlink this file to /etc/nginx/sites-available/, then
#   ln -s /etc/nginx/sites-available/shop.example.com.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Get the certificate first with certbot (run once DNS for
# shop.example.com already points at this server):
#   certbot certonly --nginx -d shop.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # Let certbot answer its HTTP-01 challenge over plain HTTP; everything
    # else should go straight to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    set $app_root /opt/shop;

    # Django admin's own static assets (collectstatic output) — served
    # directly by nginx, never proxied to gunicorn.
    location /static/ {
        alias /opt/shop/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User-uploaded files — currently just each firm's Entity.logo. Also
    # served directly by nginx; back this directory up, it's real data.
    location /media/ {
        alias /opt/shop/backend/media/;
        expires 30d;
        access_log off;
    }

    # Backend API + Django admin.
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tells Django (via SECURE_PROXY_SSL_HEADER in settings.py) that
        # the original request was HTTPS, even though this hop to
        # gunicorn is plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # The built React app (Vite's `dist/`). try_files falls back to
    # index.html for any path so client-side routing keeps working on a
    # hard refresh / direct link.
    location / {
        root /opt/shop/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
