# Browser security headers for the web app (the built React app in
# frontend/dist). Included from shop.example.com.conf in each location that
# serves it. nginx drops a server-level add_header from any location that
# sets its own, so this is included in each location rather than once.
#
# Install next to the site config:
#   sudo cp /opt/shop/deploy/nginx/security-headers.conf /etc/nginx/snippets/shop-security-headers.conf
#
# The CSP allows only the app's own scripts, styles and fonts, and
# images from the app, data: (chart downloads) and blob: (logo preview).
# The sign-in token lives in the browser's storage, so blocking injected
# scripts is what keeps a cross-site-scripting bug from stealing sessions.
# If the API is ever served from another host (VITE_API_BASE at build
# time), add that origin to connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HTTPS only for a year. This file is only used by the HTTPS server block.
add_header Strict-Transport-Security "max-age=31536000" always;
